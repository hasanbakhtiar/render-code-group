<body>



    <!-- Slider main container -->
    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img style="object-fit: cover;" width="600" height="300"
                    src="https://cdn-images.farfetch-contents.com/23/79/24/49/23792449_57944073_600.jpg" alt=""></div>
            <div class="swiper-slide"><img style="object-fit: cover;" width="600" height="300"
                    src="https://cdn-images.farfetch-contents.com/23/79/24/49/23792449_57944073_600.jpg" alt=""></div>
            <div class="swiper-slide"><img style="object-fit: cover;" width="600" height="300"
                    src="https://cdn-images.farfetch-contents.com/23/79/24/49/23792449_57944073_600.jpg" alt=""></div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
    </div>




    <section id="image-carousel" class="splide" aria-label="Beautiful Images">
        <div class="splide__track">
            <ul class="splide__list">
                <li class="splide__slide">
                    <img src="https://cdn-images.farfetch-contents.com/23/79/24/49/23792449_57944073_600.jpg" alt="">
                </li>
                <li class="splide__slide">

                </li>
            </ul>
        </div>
    </section>
